name: Build Windows installer and Claude Desktop extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # electron-builder downloads its own copy of Electron for packaging.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - run: npm run pack:mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: parallax-windows
          path: |
            release/*.exe
            release/*.mcpb
      - name: Attach the installer and the extension to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Parallax ${tag#v}" --generate-notes
          gh release upload "$tag" release/*.exe release/*.mcpb --clobber
